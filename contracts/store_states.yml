source: store_states
table: raw.store_states
primary_key: [store_id]
columns:
  - {source: Store, name: store_id,   type: integer, nullable: false}
  - {source: State, name: state_code, type: text,    nullable: false,
     allowed: [BE, BW, BY, HB, HE, HH, NI, NW, RP, SH, SN, ST, TH, "HB,NI"]}
derived_columns:
  - {name: is_state_ambiguous, type: boolean, nullable: false}
volume:
  min_rows: 1100
  max_rows: 1200
  max_change_pct: 2
